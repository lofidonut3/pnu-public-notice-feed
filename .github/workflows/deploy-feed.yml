name: Deploy public notice feed

on:
  workflow_call:
    inputs:
      collection_run_id:
        description: Successful caller run containing the validated feed artifact
        required: true
        type: string

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: feed-pages-deployment
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v5
        with:
          name: feed-output
          path: public
          run-id: ${{ inputs.collection_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: public
      - uses: actions/deploy-pages@v5
        id: deployment
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Verify deployed freshness and contracts
        run: python3 scripts/check_feed_health.py --base-url "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
