name: Deploy public notice feed

on:
  workflow_run:
    workflows: [Update public notice feed]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: feed-pages-deployment
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/download-artifact@v5
        with:
          name: feed-output
          path: public
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: public
      - uses: actions/deploy-pages@v5
        id: deployment
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Verify deployed freshness and contracts
        run: python3 scripts/check_feed_health.py --base-url "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"

  notify:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/download-artifact@v5
        with:
          name: feed-output
          path: public
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Dispatch new notice wake signal
        env:
          WATCH_DISPATCH_REPOSITORY: ${{ vars.WATCH_DISPATCH_REPOSITORY || 'lofidonut3/pnu-notice-agent-tools' }}
          WATCH_DISPATCH_TOKEN: ${{ secrets.WATCH_DISPATCH_TOKEN }}
        run: python3 scripts/dispatch_feed_update.py
