name: Update public notice feed

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "public/**"
      - "cache/feed-state.json"
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      source_limit:
        description: "Maximum notices to keep per source"
        required: false
        default: "80"
  repository_dispatch:
    types: [update-feed]

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: feed-collection
      cancel-in-progress: false
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      FEED_SOURCE_LIMIT: ${{ github.event.inputs.source_limit || github.event.client_payload.source_limit || '80' }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install validation dependencies
        run: python3 -m pip install -e ".[dev]"

      - name: Run regression checks
        run: python3 -m pytest -q

      - name: Generate feed
        env:
          PUBLIC_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: python3 -m pnu_notice_feed.generator --pretty --public-base-url "$PUBLIC_BASE_URL" --limit "$FEED_SOURCE_LIMIT" --fetch-attempts 2

      - name: Check feed size budget
        run: python3 -m pnu_notice_feed.generator --check-size-budget

      - name: Verify archive references, schemas, and checksums
        run: python3 scripts/verify_feed.py --structure-only

      - name: Commit updated feed
        run: |
          if git diff --quiet -- public cache/feed-state.json; then
            echo "No feed changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public cache/feed-state.json
          git commit -m "chore: update public notice feed"
          git push

      - name: Preserve validated output for independent deployment
        uses: actions/upload-artifact@v7
        with:
          name: feed-output
          path: public
          retention-days: 7

      - name: Report feed freshness
        continue-on-error: true
        run: python3 -m pnu_notice_feed.generator --check-feed-health
