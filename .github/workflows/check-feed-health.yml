name: Monitor public notice feed

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:
    inputs:
      exercise_recovery:
        description: Request one bounded collection wake-up even when healthy
        type: boolean
        default: false

permissions:
  contents: read
  actions: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    concurrency:
      group: feed-health-monitor
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check deployed freshness and wake collection if unhealthy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PNU_WATCHDOG_EXERCISE_RECOVERY: ${{ github.event_name == 'workflow_dispatch' && inputs.exercise_recovery && '1' || '0' }}
        run: python3 scripts/watch_feed_health.py --base-url "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
